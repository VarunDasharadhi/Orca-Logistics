services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: orca
      POSTGRES_PASSWORD: orca
      POSTGRES_DB: orca_logistics
    ports:
      - "5432:5432"
    volumes:
      - orca_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orca -d orca_logistics"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  orca_db_data:
